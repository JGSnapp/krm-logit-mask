[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "krm-logit-mask"
version = "0.1.0"
description = "Evidence-grounded competency extraction with graph-constrained decoding"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
gpu = [
  "accelerate>=1.2,<2",
  "torch>=2.5,<3",
  "transformers>=4.48,<6",
]
dev = ["pytest>=8,<10"]
web = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
krm-mask = "krm_mask.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/krm_mask"]

[tool.pytest.ini_options]
testpaths = ["tests"]

